version: '3.8'

services:
  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://kisaan_user:kisaan_pass@db:5432/kisaan_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      # API keys (GROQ_API_KEY, NVIDIA_API_KEY, GOV_API_KEY) and EMBED_MODEL
      # come from backend/.env, which the volume below mounts at /app/.env.
      # Do not pass them through as ${VAR}: when the host does not export a
      # variable, compose sets it to an empty string, and python-dotenv never
      # overrides a variable that is already set, so the key would be blank.
    depends_on:
      - db
      - redis
      - qdrant
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always

  # PostgreSQL Relational Database
  db:
    image: postgres:15-alpine
    container_name: agriva_postgres
    environment:
      - POSTGRES_USER=agriva_user
      - POSTGRES_PASSWORD=agriva_pass
      - POSTGRES_DB=agriva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: agriva_redis
    ports:
      - "6379:6379"
    restart: always

  # Qdrant Vector Database for RAG Semantic Search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agriva_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  postgres_data:
  qdrant_data:
